<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOK LAOS COMMUNITY TOUR - Form Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c0d10;
            --bg-card: #15181e;
            --bg-input: #1d212a;
            --accent-gold: #cbb079;
            --accent-gold-hover: #e3ca94;
            --accent-gold-glow: rgba(203, 176, 121, 0.25);
            --border-color: #2e3440;
            --text-main: #f0f2f5;
            --text-muted: #8c96a8;
            --black-badge: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Lao', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(203, 176, 121, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0.8) 0%, transparent 80%);
        }

        .container {
            width: 100%;
            max-width: 580px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-gold);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
        }

        /* Header Visual Banner */
        .header-banner {
            background: linear-gradient(180deg, rgba(21,24,30,0.2) 0%, var(--bg-card) 100%), #121419;
            padding: 32px 24px 20px 24px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .logo-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .brand-badge {
            background-color: var(--black-badge);
            color: var(--accent-gold);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 1.5px;
            border: 1px solid rgba(203, 176, 121, 0.3);
        }

        .sub-tag {
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .event-title {
            font-family: 'Orbitron', 'Noto Sans Lao', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            background: linear-gradient(180deg, #ffffff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .event-subtitle {
            font-size: 14px;
            color: var(--accent-gold);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Form Area */
        form {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label .required {
            color: #ff5252;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="tel"]:focus,
        select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px var(--accent-gold-glow);
        }

        select option {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        /* File Upload Box */
        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            background-color: rgba(29, 33, 42, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent-gold);
            background-color: rgba(29, 33, 42, 0.9);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .file-upload-text span {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .file-preview-name {
            margin-top: 6px;
            font-size: 12px;
            color: var(--accent-gold);
            font-weight: 600;
            word-break: break-all;
        }

        /* Submit Button */
        .btn-submit {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #a88d52 100%);
            color: #0c0d10;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(203, 176, 121, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--accent-gold-hover) 0%, var(--accent-gold) 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(203, 176, 121, 0.35);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Toast Alert */
        .status-msg {
            display: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
        }

        .status-msg.error {
            display: block;
            background-color: rgba(198, 40, 40, 0.2);
            border: 1px solid #ef5350;
            color: #e57373;
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        /* Modal Card */
        .modal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(203, 176, 121, 0.2);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            background-color: rgba(203, 176, 121, 0.15);
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 16px auto;
        }

        .modal-title {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Discord Button */
        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background-color: #5865F2;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .btn-discord:hover {
            background-color: #4752C4;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .btn-close-modal {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .btn-close-modal:hover {
            border-color: var(--text-muted);
            color: #ffffff;
        }

        .footer-credits {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background-color: #0e1014;
        }

        .footer-credits strong {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Banner Header -->
        <div class="header-banner">
            <div class="logo-row">
                <span class="sub-tag">Honor of Kings</span>
                <span class="brand-badge">BHZ</span>
            </div>
            <h1 class="event-title">HOK LAOS</h1>
            <div class="event-subtitle">COMMUNITY TOUR REGISTRATION</div>
        </div>

        <!-- Form Body -->
        <form id="regisForm">
            <div id="statusAlert" class="status-msg"></div>

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullname">ຊື່ ແລະ ນາມສະກຸນ <span class="required">*</span></label>
                <input type="text" id="fullname" name="fullname" placeholder="ຕົວຢ່າງ: ສົມຈິດ ວິໄລສັກ" required>
            </div>

            <!-- Age & Gender Grid -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label for="age">ອາຍຸ <span class="required">*</span></label>
                    <input type="number" id="age" name="age" min="10" max="80" placeholder="ຕົວຢ່າງ: 20" required>
                </div>
                <div class="form-group">
                    <label>ເພດ <span class="required">*</span></label>
                    <select name="gender" id="gender" required>
                        <option value="" disabled selected>ເລືອກເພດ</option>
                        <option value="ชาย">ຊາຍ</option>
                        <option value="หญิง">ຍິງ</option>
                        <option value="อื่นๆ">ອື່ນໆ / ບໍ່ລະບຸ</option>
                    </select>
                </div>
            </div>

            <!-- Game ID -->
            <div class="form-group">
                <label for="game_id">ໄອດີເກມ (Game ID / UID) <span class="required">*</span></label>
                <input type="text" id="game_id" name="game_id" placeholder="ຕົວຢ່າງ: 893420194" required>
            </div>

            <!-- Contact Channel -->
            <div class="form-group">
                <label for="contact">ຊ່ອງທາງຕິດຕໍ່ (Tel / Telegram / FB) <span class="required">*</span></label>
                <input type="text" id="contact" name="contact" placeholder="ຕົວຢ່າງ: Telegram: @username / 020 5X XXX XXX" required>
            </div>

            <!-- Game Profile Image -->
            <div class="form-group">
                <label>ຮູບໂປຮໄຟຮເກມ (Profile Screenshot) <span class="required">*</span></label>
                <div class="file-upload-wrapper">
                    <input type="file" id="profile_img" accept="image/*" required onchange="handleFileSelect(event)">
                    <div class="file-upload-text">
                        <span>ກົດເພື່ອອັບໂຫຼດຮູບ</span> ຫຼື ລາກຮູບມາໃສ່ທີ່ນີ້<br>
                        (PNG, JPG)
                    </div>
                    <div id="fileNameDisplay" class="file-preview-name"></div>
                </div>
            </div>

            <!-- Hidden field for Base64 Image string -->
            <input type="hidden" id="imageBase64" name="imageBase64">

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn-submit">ລົງທະບຽນເຂົ້າຮ່ວມ</button>
        </form>

        <div class="footer-credits">
            POWERED BY <strong>BACK HURTZ E-SPORT</strong>
        </div>
    </div>

    <!-- Success Modal Notification -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon">✓</div>
            <h2 class="modal-title">ລົງທະບຽນສໍາເລັດ!</h2>
            <p class="modal-desc">ຂໍ້ມູນຂອງທ່ານຖືກສົ່ງຮຽບຮ້ອຍແລ້ວ. ກະລຸນາເຂົ້າຮ່ວມ Discord ຂອງພວກເຮົາເພື່ອຕິດຕາມຕາຕະລາງການແຂ່ງຂັນ.</p>
            
            <!-- Discord Community Button -->
            <a href="https://discord.gg/B9VGdngFC6" target="_blank" class="btn-discord">
                <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0,0,3.36,101.6,101.6,0,0,0,-35.8,0A72.06,72.06,0,0,0,45.67,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65,-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1,-10.85,-5.18c.91,-0.66,1.8,-1.34,2.66,-2a75.57,75.57,0,0,0,64.32,0c.87.69,1.76,1.37,2.66,2a68.68,68.68,0,0,1,-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19,-16.14c2.64,-27.38,-4.51,-51.11,-21.82,-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53C31,46,36,40.3,42.45,40.3C48.9,40.3,54,46,53.9,53C53.9,60,48.9,65.69,42.45,65.69Zm42.24,0C78.42,65.69,73.25,60,73.25,53C73.25,46,78.42,40.3,84.69,40.3C91,40.3,96.12,46,96,53C96,60,91,65.69,84.69,65.69Z"/>
                </svg>
                ເຂົ້າຮ່ວມ DISCORD COMMUNITY
            </a>

            <button type="button" class="btn-close-modal" onclick="closeModal()">ປິດໜ້າຕ່າງ</button>
        </div>
    </div>

    <script>
        // Replace with your Google Apps Script Web App URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwnX4mLFZfIQorPlL1ytIMKbQbxSjJCte0qd8SjQ7AcoFKcHsG0KgFOaETOsNDcVE/exec";

        let base64String = "";

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').textContent = "ເລືອກຮູບແລ້ວ: " + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64String = e.target.result.split(',')[1];
                    document.getElementById('imageBase64').value = base64String;
                };
                reader.readAsDataURL(file);
            }
        }

        function showSuccessModal() {
            document.getElementById('successModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
        }

        document.getElementById('regisForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusAlert = document.getElementById('statusAlert');

            if (SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
                statusAlert.className = "status-msg error";
                statusAlert.textContent = "ກະລຸນາໃສ່ SCRIPT_URL ໃນ Dynamic JavaScript ກ່ອນ (Please setup Google Apps Script URL)";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "ກຳລັງສົ່ງຂໍ້ມູນ...";
            statusAlert.style.display = "none";

            const formData = {
                fullname: document.getElementById('fullname').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                game_id: document.getElementById('game_id').value,
                contact: document.getElementById('contact').value,
                imageBase64: base64String
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                document.getElementById('regisForm').reset();
                document.getElementById('fileNameDisplay').textContent = "";
                base64String = "";
                
                submitBtn.disabled = false;
                submitBtn.textContent = "ລົງທະບຽນເຂົ້າຮ່ວມ";

                showSuccessModal();
            })
            .catch(error => {
                console.error('Error!', error.message);
                statusAlert.className = "status-msg error";
                statusAlert.textContent = "ເກີດຂໍ້ຜິດພາດ. ກະລຸນາລອງໃໝ່ອີກຄັ້ງ.";
                submitBtn.disabled = false;
                submitBtn.textContent = "ລົງທະບຽນເຂົ້າຮ່ວມ";
            });
        });
    </script>
</body>
</html>
